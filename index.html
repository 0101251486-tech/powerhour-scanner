<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Power Hour Live Attendance Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0b1120;
      color: #ffffff;
      text-align: center;
      padding: 16px 12px 32px;
      margin: 0;
    }
    h2 {
      font-size: 20px;
      color: #38bdf8;
      margin: 6px 0 16px;
      letter-spacing: 0.5px;
    }
    #reader {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #334155;
      background: #000;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }
    #status-msg {
      font-size: 13px;
      color: #94a3b8;
      margin: 10px 0;
    }
    #result {
      max-width: 360px;
      margin: 16px auto 0;
      padding: 16px;
      border-radius: 12px;
      font-size: 18px;
      line-height: 26px;
      font-weight: 700;
      display: none;
    }
    .success { background: #14532d; border: 2px solid #22c55e; color: #86efac; }
    .warn { background: #713f12; border: 2px solid #eab308; color: #fef08a; }
    .error { background: #7f1d1d; border: 2px solid #ef4444; color: #fca5a5; }

    .manual-box {
      max-width: 360px;
      margin: 22px auto 0;
      padding: 16px;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #475569;
    }
    .manual-input {
      padding: 11px 14px;
      font-size: 20px;
      border-radius: 6px;
      border: 1.5px solid #64748b;
      width: 48%;
      font-weight: bold;
      text-align: center;
      background: #0f172a;
      color: #fff;
      letter-spacing: 2px;
    }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Power Hour Live Check-in Desk</h2>

  <div id="reader"></div>
  <div id="status-msg">Camera starting automatically...</div>
  <div id="result"></div>

  <!-- NUMERIC KEYPAD MANUAL ENTRY -->
  <div class="manual-box">
    <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #93c5fd;">FAST REG NUMBER ENTRY</div>
    <input 
      type="tel" 
      inputmode="numeric" 
      pattern="[0-9]*" 
      id="manual-code" 
      class="manual-input" 
      placeholder="e.g. 031 or 31" 
      onkeydown="if(event.key==='Enter') manualCheckIn()">
    <button class="btn" onclick="manualCheckIn()">Submit</button>
  </div>

  <script>
    // ----------------------------------------------------
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
    // ----------------------------------------------------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRb7j3G4JLiik0K4Y2hFyuSxC0iruQ34oc-VC-akGtRJaWpgj6MZ7fbswXib_Mg5j6gw/exec";

    let isProcessing = false;

    function handleDecoded(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const resultDiv = document.getElementById("result");
      resultDiv.style.display = "block";
      resultDiv.className = "warn";
      resultDiv.innerHTML = "Verifying: " + decodedText + "...";

      fetch(SCRIPT_URL + "?code=" + encodeURIComponent(decodedText))
        .then(res => res.json())
        .then(response => {
          if (response.status === "SUCCESS") {
            resultDiv.className = "success";
            resultDiv.innerHTML = "CHECKED IN!<br><span style='font-size:22px; color:#fff;'>" + response.name + "</span><br>(" + response.regNo + ")";
          } else if (response.status === "ALREADY_CHECKED_IN") {
            resultDiv.className = "warn";
            resultDiv.innerHTML = "ALREADY PRESENT<br><span style='font-size:19px; color:#fff;'>" + response.name + "</span><br>(" + response.regNo + ")";
          } else {
            resultDiv.className = "error";
            resultDiv.innerHTML = "NOT FOUND / INVALID<br>(" + response.regNo + ")";
          }
          setTimeout(() => { isProcessing = false; }, 2200);
        })
        .catch(err => {
          resultDiv.className = "error";
          resultDiv.innerHTML = "Network error. Please try again.";
          setTimeout(() => { isProcessing = false; }, 2200);
        });
    }

    const html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 15, qrbox: { width: 240, height: 240 } },
      (decodedText) => handleDecoded(decodedText),
      () => {}
    ).then(() => {
      document.getElementById("status-msg").innerText = "Point camera at participant's QR code";
    }).catch(err => {
      document.getElementById("status-msg").innerHTML = "<span style='color:#ef4444;'>Camera error: " + err + "</span>";
    });

    function manualCheckIn() {
      let val = document.getElementById("manual-code").value.trim().toUpperCase();
      if (!val) return;

      if (!val.startsWith("AW-")) {
        const num = val.replace(/[^0-9]/g, "");
        if (num) val = "AW-" + num.padStart(3, "0");
      }

      handleDecoded(val);
      document.getElementById("manual-code").value = "";
    }
  </script>
</body>
</html>
